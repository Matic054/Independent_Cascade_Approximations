[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-diffusion-approximations"
version = "0.1.0"
license = "MIT"
description = "Implementations and benchmarks for analytical approximations of Independent Cascade node activation probabilities."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Matic Požar" },
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "networkx>=3.2,<4.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "numba>=0.60,<1.0",
]

[project.optional-dependencies]
notebook = [
    "matplotlib>=3.8,<4.0",
    "jupyterlab>=4.0,<5.0",
    "ipykernel>=6.29,<7.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = [
    "GraphIC",
    "ic_calibration",
    "synthetic_benchmark",
    "real_world_benchmark",
    "utilities",
    "edge_probabilities",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*"]

[tool.ruff]
line-length = 100
target-version = "py310"
